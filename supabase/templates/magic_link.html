<!doctype html>
<html>
  <body style="margin:0;padding:32px 24px;background:#F6F3EC;color:#161512;font-family:Georgia,'Times New Roman',serif;">
    <div style="max-width:420px;margin:0 auto;">
      <div style="font-size:30px;font-weight:700;letter-spacing:-0.01em;">Press<span style="color:#C8102E;">.</span></div>
      <div style="height:1px;background:#D9D3C5;margin:14px 0 26px;"></div>
      <p style="margin:0 0 10px;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#8B867C;">Your sign-in code</p>
      <p style="margin:0 0 26px;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:34px;font-weight:600;letter-spacing:0.12em;">{{ .Token }}</p>
      <p style="margin:0;font-size:16px;line-height:24px;color:#5B574F;">Type it into Press. It works once and expires in an hour. If you did not ask for it, ignore this.</p>
    </div>
  </body>
</html>
